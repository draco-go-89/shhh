<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd page</title>
    <style>
        /* Mobile-first sizing container */
        .video-container {
            display: center;
            width: 100%;
            max-width: 100%;
            /* Constrains size on larger screens */
            margin: 1rem auto;
        }

        /* Enforce block display and exact dimensions */
        .video-player {
            display: center;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            /* Maintains standard widescreen proportions */
            object-fit: cover;
            /* Prevents distortion */
            border-radius: 8px;
        }

        .svg {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #showBtn {
            color: black;
        }

        /* this one for utube palylist */
        .nav-link {
            color: black;
            text-decoration: none;
            transition: 0.2s;
        }

        .menu {
            display: flex;
            justify-content: center;
            padding: 1px;
            backdrop-filter: blur(10px);
            background: rgba(245, 245, 245, 0);
            border: 1px solid rgba(245, 245, 245, 0);

        }
    </style>
</head>

<body>
    <!-- <section class="svg">
        <img src="hang.svg" alt="bird" width="50%" height="auto">
    </section> -->

    <div>
        <!-- bring here the svg section to disable them when scroll sticky postion -->
        <button id="showBtn" onclick="showContent()">nothing for now</button>
        <template id="video-template">
            <div class="video-container">
                <img class="video-player" src=" "/>
            </div>

            <button id="showBtn" onclick="showContent()">show again</button>
            <!-- <button><a href="https://www.youtube.com/watch?v=PMk8L9FNqnY&list=PLqK6-pJRN1VbH2fpK0jAFJDAiW_WVsVgg&pp=sAgC" class="nav-link">Youthube playlist</a></button> -->
        </template>
    </div>
    <p>
        <button>
            <nav class="menu">
                <a href="https://draco-go-89.github.io/music-player/" class="nav-link">playlist</a>
            </nav>
        </button>
    </p>
    <script>
        function showContent() {
            const temp = document.getElementById("video-template");
            const clon = temp.content.cloneNode(true);

            // Append the cloned node
            document.body.appendChild(clon);

            // Optional: disable button to prevent multiple duplicate videos
            document.getElementById("showBtn").disabled = true;
        }
    </script>

</body>

</html>
