<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd page</title>
    <style>
        /* Mobile-first sizing container */
        .video-container {
            display: center;
            width: 100%;
            max-width: 100%; /* Constrains size on larger screens */
            margin: 1rem auto;
        }

        /* Enforce block display and exact dimensions */
        .video-player {
            display: center;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; /* Maintains standard widescreen proportions */
            object-fit: cover;    /* Prevents distortion */
            border-radius: 8px;
        }

        .svg {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #showBtn {
            position: absolute;
            color: black
        }
    </style>
</head>
<body>

    <div>
        <section class="svg">
            <img src="hang.svg" alt="bird" width="50%" height="auto">
        </section>

        <button id="showBtn" onclick="showContent()">show something</button>
        <template id="video-template">
            <div class="video-container">
                <video class="video-player" controls playsinline poster="image2.jpg">
                    <source src="uzi.mp4" type="video/mp4" />
                    Your browser does not support the video tag.
                </video>
            </div>
            <button id="showBtn" onclick="showContent()">show something</button>
        </template>
    </div>

    <script>
        function showContent() {
            const temp = document.getElementById("video-template");
            const clon = temp.content.cloneNode(true);
            
            // Append the cloned node
            document.body.appendChild(clon);

            // Optional: disable button to prevent multiple duplicate videos
            document.getElementById("showBtn").disabled = true;
        }
    </script>

</body>
</html>
