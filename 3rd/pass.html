<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            /* background-color: #f5f7fa; */
            background-image: url(image3.jpg);
            background-size: cover;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
        }

        .main-card {
            display: inline-block;
            background: #ffffffbb;
            padding: 30px;
            border-radius: 2px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            max-width: 440px;
            width: 100%;
            text-align: center;
        }


        p {
            font-size: 15px;
            color: #2f353c;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Simple CSS Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background-color: #090909d3;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-cancel {
            background-color: #eaf0fb;
            color: #252c38;
            margin-top: 8px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgb(115, 168, 230); */
            background-image: url(image3.jpg);
            background-size: contain;
            scroll-padding-block: initial;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Modal Box */
        .modal-box {
            background: url(image3.jpg);
            /* background img */
            background-repeat: no-repeat;
            background-size: cover;
            padding: 24px;
            border-radius: 2px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .modal-box input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin: 14px 0 12px;
            outline: none;
        }

        .modal-box input[type="password"]:focus {
            border-color: #276afb;
        }

        .error-msg {
            color: #dc2626;
            font-size: 10px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- Landing Card -->
    <div class="main-card">
        <p>Tap here to unlock a surprise</p>
        <button class="btn" onclick="openGate('pass.txt')">ONLY4U</button>
    </div>

    <!-- Password Prompt Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-box">
            <!-- <h3>Enter Password</h3> -->
            <p style="font-size: 13px; margin-bottom: 0;">Password is your first 6 digit Mobile Number</p>

            <input type="password" id="passInput" placeholder="Your first 6 digit mobile number"
                onkeydown="handleKey(event)" />

            <button class="btn" style="width: 100%;" onclick="submitGate()">Continue</button>
            <button class="btn btn-cancel" style="width: 100%;" onclick="closeGate()">Give Up</button>

            <p id="errorMsg" class="error-msg">[Incorrect password. Enter the correct digits or its not for you]</p>
        </div>
    </div>

    <script>
        const PASSCODE = "995403";
        let pendingDestination = "";

        function openGate(targetUrl) {
            pendingDestination = targetUrl;
            document.getElementById("passInput").value = "";  //already given digits of password
            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("passwordModal").style.display = "flex";
            document.getElementById("passInput").focus();
        }

        function closeGate() {
            document.getElementById("passwordModal").style.display = "none";
            pendingDestination = "";
        }

        function submitGate() {
            const entered = document.getElementById("passInput").value;
            const error = document.getElementById("errorMsg");

            if (entered === PASSCODE) {
                // Redirect to the link or internal file (e.g., 'dashboard.html')
                window.location.href = pendingDestination;
            } else {
                error.style.display = "block";
            }
        }

        function handleKey(e) {
            if (e.key === "Enter") {
                submitGate();
            }
        }
    </script>

</body>

</html>
