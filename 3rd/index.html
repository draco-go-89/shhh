<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ur mine</title>
    <style>
        body {
            background-color: #e7f7ffde;
            background-image: url("yo.jpg");
            background-size: cover;
            height: 100dvh;
        }
        .btn { cursor: pointer; display: inline-block; }
        .lyrics { 
            font-weight: 500; 
            font-family: sans-serif; 
            font-style: italic; 
            width: 76%; 
            height: 90px; 
            position: inherit; 
            background-image: url(forest.jpg); 
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <p>
        <textarea id="lyricsTextarea" class="lyrics"></textarea>
    </p>

    <div class="dropdown-wrapper">
        <select id="audioDropdown">
            <option value="" disabled selected>Select</option>
            <option value="makeumine.mp3">make u mine</option>
            <option value="mine.mp3">this is for my g</option>
            <option value="ritual.mp3">ritual</option>
            <option value="apocalypse.mp3">apocalypse</option>
        </select>
    </div>

    <div class="controls" style="margin-top: 10px;">
        <button id="playBtn">Play</button>
        <button id="stopBtn">Stop</button>
    </div>

    <audio id="mainAudio"></audio>

    <script>
        const dropdown = document.getElementById('audioDropdown');
        const audioPlayer = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const lyricsTextarea = document.getElementById('lyricsTextarea');

        // 1. Define lyrics for each song filename
        const songLyrics = {
            "mine.mp3": `my my my my my girl,
this is for my girl, 
my sexy girl in my heart`, // can do enter for new lines if only one ` (up the tab key) is given in the string
            "apocalypse.mp3": `You leapt from crumbling bridges 
watching cityscapes turn to dust
Filming helicopters crashing in the ocean from way above

Got the music in you baby,
Tell me why
Got the music in you baby,
Tell me why
You\’ve been locked in here forever & you just can\’t say goodbye

Kisses on the foreheads of the lovers wrapped in your arms
You\’ve been hiding them in hollowed out pianos left in the dark…

Your lips,
My lips,
Apocalypse

Go & sneak us through the rivers,
Flood is rising up on your knees
Oh please…
Come out & haunt me
I know you want me
Come out & haunt me

Sharing all your secrets with each other since you were kids
Sleeping soundly with the locket that she gave you 
clutched in your fist…

When you\’re all alone
I will reach for you
When you\’re feeling low
I will be there too`
            
        };

        // Handle song changes from the dropdown
        dropdown.addEventListener('change', function () {
            const selectedTrackUrl = this.value;

            // 2. Check if the selected song has lyrics defined
            if (songLyrics[selectedTrackUrl]) {
                lyricsTextarea.value = songLyrics[selectedTrackUrl]; // Update content
                lyricsTextarea.style.display = "block";              // Show textarea
            } else {
                lyricsTextarea.style.display = "none";               // Hide if no lyrics
            }

            if (selectedTrackUrl) {
                audioPlayer.src = selectedTrackUrl;
                audioPlayer.load();
                audioPlayer.play().catch(error => {
                    console.log("Playback interaction error caught: ", error);
                });
            }
        });

        // Play button functionality
        playBtn.addEventListener('click', function () {
            if (audioPlayer.src) {
                audioPlayer.play().catch(error => {
                    console.log("Error playing audio: ", error);
                });
            } else {
                alert("Please select a song from the dropdown first!");
            }
        });

        // Stop button functionality
        stopBtn.addEventListener('click', function () {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        });
    </script>
</body>
</html>
