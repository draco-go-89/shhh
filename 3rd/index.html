    <!-- Simple Play/Stop Buttons -->
    <div class="controls" style="margin-top: 10px;">
        <button id="playBtn">Play</button>
        <button id="stopBtn">Stop</button>
    </div>

    <!-- Hidden HTML Audio Element -->
    <audio id="mainAudio"></audio>

    <script>
        const dropdown = document.getElementById('audioDropdown');
        const audioPlayer = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        // 2. TARGET THE TEXTAREA ELEMENT
        const lyricsTextarea = document.getElementById('lyricsTextarea'); 

        // 1. Handle song changes from the dropdown
        dropdown.addEventListener('change', function () {
            const selectedTrackUrl = this.value;

            // 3. TOGGLE VISIBILITY BASED ON THE SELECTED TRACK
            // Add any other triggering filenames inside the array brackets, separated by commas
            const triggeringSongs = ["mine.mp3"]; 

            if (triggeringSongs.includes(selectedTrackUrl)) {
                lyricsTextarea.style.display = "block"; // Show lyrics
            } else {
                lyricsTextarea.style.display = "none";  // Hide lyrics for any other file
            }

            if (selectedTrackUrl) {
                audioPlayer.src = selectedTrackUrl;
                audioPlayer.load();
                audioPlayer.play().catch(error => {
                    console.log("Playback interaction error caught: ", error);
                });
            }
        });

        // 2. Play button functionality
        playBtn.addEventListener('click', function () {
            if (audioPlayer.src) {
                audioPlayer.play().catch(error => {
                    console.log("Error playing audio: ", error);
                });
            } else {
                alert("Please select a song from the dropdown first!");
            }
        });

        // 3. Stop button functionality
        stopBtn.addEventListener('click', function () {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        });
    </script>
