<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ur mine</title>
    <style>
        .btn {
            cursor: pointer;
            display: inline-block;
        }

        .lyrics {
            font-weight: 500;
            font-family: sans-serif;
            font-style: italic;
            width: 76%;
            height: 90px;
            position: inherit;
            background-image: url(forest.jpg);
            /* 1. HIDES THE LYRICS BY DEFAULT */
            display: none; 
        }
    </style>
</head>

<body>
    <p>
        <!-- Added an ID here so JavaScript can easily target it -->
        <textarea id="lyricsTextarea" class="lyrics">

    Your lips,
    My lips,
    Apocalypse
        </textarea>
    </p>

    <div class="dropdown-wrapper">
        <select id="audioDropdown">
            <option value="" disabled selected>Select</option>
            <option value="mine.mp3">ur mine</option>
            <option value="apocalypse.mp3">apocalypse:cas</option>
            <option value="ritual.mp3">ritual</option>
            <option value="silence.mp3">silence</option>
        </select>
    </div>

    <!-- Simple Play/Stop Buttons -->
    <div class="controls" style="margin-top: 10px;">
        <button id="playBtn">Play</button>
        <button id="stopBtn">Stop</button>
    </div>

    <!-- Hidden HTML Audio Element -->
    <audio id="mainAudio"></audio>

    <script>
        const dropdown = document.getElementById('audioDropdown');
        const audioPlayer = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        // 2. TARGET THE TEXTAREA ELEMENT
        const lyricsTextarea = document.getElementById('lyricsTextarea'); 

        // 1. Handle song changes from the dropdown
        dropdown.addEventListener('change', function () {
            const selectedTrackUrl = this.value;

            // 3. TOGGLE VISIBILITY BASED ON THE SELECTED TRACK
            // Add any other triggering filenames inside the array brackets, separated by commas
            const triggeringSongs = ["apocalypse.mp3"]; 

            if (triggeringSongs.includes(selectedTrackUrl)) {
                lyricsTextarea.style.display = "block"; // Show lyrics
            } else {
                lyricsTextarea.style.display = "none";  // Hide lyrics for any other file
            }

            if (selectedTrackUrl) {
                audioPlayer.src = selectedTrackUrl;
                audioPlayer.load();
                audioPlayer.play().catch(error => {
                    console.log("Playback interaction error caught: ", error);
                });
            }
        });

        // 2. Play button functionality
        playBtn.addEventListener('click', function () {
            if (audioPlayer.src) {
                audioPlayer.play().catch(error => {
                    console.log("Error playing audio: ", error);
                });
            } else {
                alert("Please select a song from the dropdown first!");
            }
        });

        // 3. Stop button functionality
        stopBtn.addEventListener('click', function () {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        });
    </script>
</body>
</html>
