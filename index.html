<body>

    <div class="dashboard-container">

            <nav class="menu">

        <aside></aside>

    <p>    <!-- <p>tap anh stop the moving</p> -->
        <marquee
            class="outline"
            direction="down"
            width= 50%
            height=70%
            behavior="alternate"
            scrollamount="11"
            onmouseover="this.stop()" 
            onmouseout="this.start()"
            >

            <marquee
                behavior="alternate"

        </marquee>
    </p>
    <section>
        <img src="image/image3.jpg" width="50%">
        <span class="blink-text">fucking in fighting on</span>
        <!-- here show something till script close -->
        <div>
            <button onclick="showContent()">show something</button>
            <template>
                <img src="image/image1.jpg" width="50%" height="190">
            </template>
            <script>
                function showContent() {
                    let temp = document.getElementsByTagName("template")[0];
                    let clon = temp.content.cloneNode(true);
                    document.body.appendChild(clon);
                }
            </script>
        </div>
    </section>
</body>
